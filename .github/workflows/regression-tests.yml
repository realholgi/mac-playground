name: Regression tests

on:
  pull_request:
    paths:
      - '.github/workflows/regression-tests.yml'
      - 'ApiCompatExcludeAttributes.txt'
      - 'Directory.Build.*'
      - 'NuGet.config'
      - 'global.json'
      - 'eng/**'
      - 'MacApi/**'
      - 'MacBridge.Test/**'
      - 'Mono.WebBrowser/**'
      - 'System.Drawing.Common/**'
      - 'System.Windows.Forms/**'
      - 'System.Windows.Forms.Primitives/**'
      - 'FormsTest/Forms/**'
      - 'tests/FormsTest.Test/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/regression-tests.yml'
      - 'ApiCompatExcludeAttributes.txt'
      - 'Directory.Build.*'
      - 'NuGet.config'
      - 'global.json'
      - 'eng/**'
      - 'MacApi/**'
      - 'MacBridge.Test/**'
      - 'Mono.WebBrowser/**'
      - 'System.Drawing.Common/**'
      - 'System.Windows.Forms/**'
      - 'System.Windows.Forms.Primitives/**'
      - 'FormsTest/Forms/**'
      - 'tests/FormsTest.Test/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.401'

      - name: Install matching macOS workload
        id: workload
        run: |
          test "$(dotnet --version)" = '10.0.401'
          xcodebuild -version
          dotnet workload install macos --version 10.0.401.1
          dotnet workload --info

      - name: Run matrix regressions
        run: >-
          dotnet test MacBridge.Test/MacBridge.Test.csproj
          --configuration Debug
          --runtime osx-arm64
          --filter "FullyQualifiedName~MacBridge.Test.MatrixTests"
          --logger "trx;LogFileName=matrix.trx"
          --results-directory "$RUNNER_TEMP/regression-test-results"

      - name: Build Forms test application
        id: forms_build
        if: ${{ !cancelled() && steps.workload.outcome == 'success' }}
        run: dotnet build tests/FormsTest.Test/FormsTest.Test.csproj --configuration Debug --runtime osx-arm64

      - name: Run graphics and grid regressions on the main thread
        if: ${{ !cancelled() && steps.forms_build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/regression-test-results"
          tests/FormsTest.Test/bin/Debug/net10.0-macos27.0/osx-arm64/FormsTest.Test.app/Contents/MacOS/FormsTest.Test \
            --where 'class == FormsTest.Test.GraphicsTransformTests or class == FormsTest.Test.DataGridViewSortTests' \
            --result="$RUNNER_TEMP/regression-test-results/forms.xml"

      - name: Upload small failure reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-test-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/regression-test-results/*.trx
            ${{ runner.temp }}/regression-test-results/*.xml
          if-no-files-found: ignore
          retention-days: 3
